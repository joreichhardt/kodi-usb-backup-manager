name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q service.py resources/lib
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: ShellCheck
        run: shellcheck install.sh
